kind: mcp
name: supabase
version: 0.1.0
description: Supabase MCP server — full-stack backend access including Postgres queries, auth user management, storage operations, and edge function deployment. Use whenever working on a Supabase project and the agent needs to query data, manage users, or inspect the database schema.
domain: tooling
priority: P1

compatibility:
  opencode: native
  codex: native
  cursor: native
  kimi: native

source:
  type: npm
  package: "@supabase/mcp-server-supabase"

mcp_command:
  - npx
  - "-y"
  - "@supabase/mcp-server-supabase@0.8.1"

requires:
  binaries: [npx, node]
  env: [SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY]

triggers:
  - supabase
  - supabase database
  - supabase auth
  - supabase storage
  - edge functions
  - row level security

links:
  upstream: https://github.com/supabase-community/supabase-mcp
  docs: https://supabase.com/docs/guides/ai/mcp
