kind: mcp
name: playwright
version: 0.1.0
description: Playwright MCP letting the agent drive a real browser — navigate, click, fill forms, screenshot, read DOM. Use whenever frontend work needs end-to-end visual or interaction verification beyond reading source code.
domain: frontend
priority: P0

compatibility:
  opencode: native
  codex: native
  cursor: native
  kimi: native

source:
  type: npm
  package: "@playwright/mcp"

mcp_command:
  - npx
  - "-y"
  - "@playwright/mcp@3.1.0"

requires:
  binaries: [npx, node]

triggers:
  - browser
  - playwright
  - screenshot
  - end-to-end
  - visual verification
  - DOM inspection

links:
  upstream: https://github.com/microsoft/playwright-mcp
