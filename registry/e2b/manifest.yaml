kind: mcp
name: e2b
version: 0.1.0
description: E2B MCP server — secure cloud sandboxes for running arbitrary code in isolated containers. Use whenever the agent needs to safely execute untrusted code, run scripts in a clean environment, test code snippets, or perform operations that should not affect the local machine.
domain: code-quality
priority: P1

compatibility:
  opencode: native
  codex: native
  cursor: native
  kimi: native

source:
  type: npm
  package: "@e2b/mcp-server"

mcp_command:
  - npx
  - "-y"
  - "@e2b/mcp-server"

requires:
  binaries: [npx, node]
  env: [E2B_API_KEY]

triggers:
  - sandbox
  - code execution
  - isolated environment
  - run code
  - e2b
  - safe execution

links:
  upstream: https://github.com/e2b-dev/mcp-server
  docs: https://e2b.dev/docs
