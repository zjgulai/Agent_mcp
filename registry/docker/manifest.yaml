kind: mcp
name: docker
version: 0.1.0
description: Docker MCP server — container and compose stack management including listing containers, inspecting images, starting/stopping services, and reading logs. Use whenever the agent needs to manage local Docker workloads, debug containers, or orchestrate compose services.
domain: ops
priority: P1

compatibility:
  opencode: native
  codex: native
  cursor: native
  kimi: native

source:
  type: pypi
  package: mcp-server-docker

mcp_command:
  - uvx
  - mcp-server-docker

requires:
  binaries: [uvx, docker]

triggers:
  - docker
  - container
  - compose
  - docker logs
  - image
  - dockerfile

links:
  upstream: https://github.com/ckreiling/mcp-server-docker
  docs: https://docs.docker.com
