kind: mcp
name: linear
version: 0.1.0
description: Linear MCP (official remote, bridged to stdio via mcp-remote) enabling the agent to read tickets, update statuses, query cycles, surface assigned work. First launch opens a browser OAuth flow. Use whenever development work starts from a ticket (not a free-form prompt) and progress should be reflected back in the team's tracker.
domain: tooling
priority: P1

compatibility:
  opencode: native
  codex: native
  cursor: native
  kimi: native

source:
  type: npm
  package: "mcp-remote"

mcp_command:
  - npx
  - "-y"
  - "mcp-remote@0.14.2"
  - "https://mcp.linear.app/mcp"

requires:
  binaries: [npx, node]

triggers:
  - linear
  - ticket
  - issue tracker
  - sprint
  - cycle

links:
  upstream: https://mcp.linear.app
