kind: mcp
name: gitlab
version: 0.1.0
description: GitLab MCP server — project management, merge request operations, issue tracking, CI/CD pipeline inspection, and repository access via the GitLab API. Use whenever working with GitLab-hosted repositories, MRs, or pipelines instead of GitHub.
domain: tooling
priority: P2

compatibility:
  opencode: native
  codex: native
  cursor: native
  kimi: native

source:
  type: npm
  package: "@zereight/mcp-gitlab"

mcp_command:
  - npx
  - "-y"
  - "@zereight/mcp-gitlab@2.1.62"

requires:
  binaries: [npx, node]
  env: [GITLAB_PERSONAL_ACCESS_TOKEN, GITLAB_URL]

triggers:
  - gitlab
  - merge request
  - MR
  - gitlab pipeline
  - gitlab CI
  - gitlab issue

links:
  upstream: https://github.com/zereight/gitlab-mcp
  docs: https://docs.gitlab.com/api/rest/
