kind: mcp
name: vercel
version: 0.1.0
description: Vercel MCP server (official remote, bridged to stdio via mcp-remote) — deployment management, build status inspection, environment variable management, and log access. Use whenever the agent needs to trigger deployments, check build failures, manage env vars, or inspect Vercel project status. First launch opens a browser OAuth flow.
domain: tooling
priority: P2

compatibility:
  opencode: native
  codex: native
  cursor: native
  kimi: native

source:
  type: npm
  package: "mcp-remote"

mcp_command:
  - npx
  - "-y"
  - "mcp-remote@0.14.2"
  - "https://mcp.vercel.com"

requires:
  binaries: [npx, node]

triggers:
  - vercel
  - deployment
  - build status
  - preview deployment
  - vercel project
  - frontend deploy

links:
  upstream: https://vercel.com/docs/agent-resources/vercel-mcp
  docs: https://vercel.com/docs/mcp
