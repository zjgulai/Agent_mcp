kind: mcp
name: slack
version: 0.1.0
description: Slack MCP server (official remote, bridged to stdio via mcp-remote) — channel management, message posting, thread reading, and user lookup. First launch opens a browser OAuth flow. Use whenever the agent needs to send notifications, search conversations, post updates to channels, or retrieve team communication history.
domain: tooling
priority: P1

compatibility:
  opencode: native
  codex: native
  cursor: native
  kimi: native

source:
  type: npm
  package: "mcp-remote"

mcp_command:
  - npx
  - "-y"
  - "mcp-remote@0.14.2"
  - "https://mcp.slack.com/mcp"

requires:
  binaries: [npx, node]

triggers:
  - slack
  - channel
  - message
  - notification
  - team communication
  - post to slack

links:
  upstream: https://api.slack.com/mcp
  docs: https://api.slack.com/docs
