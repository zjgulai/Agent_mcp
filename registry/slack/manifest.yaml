kind: mcp
name: slack
version: 0.1.0
description: Slack MCP server — channel management, message posting, thread reading, and user lookup via the Slack API. Use whenever the agent needs to send notifications, search conversations, post updates to channels, or retrieve team communication history.
domain: ops
priority: P1

compatibility:
  opencode: native
  codex: native
  cursor: native
  kimi: native

source:
  type: npm
  package: "@zencoderai/slack-mcp-server"

mcp_command:
  - npx
  - "-y"
  - "@zencoderai/slack-mcp-server"

requires:
  binaries: [npx, node]
  env: [SLACK_BOT_TOKEN, SLACK_TEAM_ID]

triggers:
  - slack
  - channel
  - message
  - notification
  - team communication
  - post to slack

links:
  upstream: https://github.com/zencoderai/slack-mcp-server
  docs: https://api.slack.com/docs
