kind: mcp
name: figma
version: 0.1.0
description: Figma MCP exposing design files structure, tokens, components, text content, dimensions. Use whenever the agent must implement frontend from a Figma source-of-truth instead of guessing from screenshots. Best paired with frontend-design skill and playwright MCP.
domain: frontend
priority: P1

compatibility:
  opencode: native
  codex: native
  cursor: native
  kimi: native

source:
  type: npm
  package: "@figma/mcp-server"

mcp_command:
  - npx
  - "-y"
  - "@figma/mcp-server"

requires:
  binaries: [npx, node]
  env: [FIGMA_API_TOKEN]

triggers:
  - figma
  - design tokens
  - component spec
  - design handoff

links:
  upstream: https://www.figma.com/community/plugins/develop
