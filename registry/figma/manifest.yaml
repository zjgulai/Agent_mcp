kind: mcp
name: figma
version: 0.1.0
description: Figma MCP (figma-developer-mcp) exposing design files structure, tokens, components, text content, dimensions. Use whenever the agent must implement frontend from a Figma source-of-truth instead of guessing from screenshots. Best paired with frontend-design skill and playwright MCP.
domain: tooling
priority: P1

compatibility:
  opencode: native
  codex: native
  cursor: native
  kimi: native

source:
  type: npm
  package: "figma-developer-mcp"

mcp_command:
  - npx
  - "-y"
  - "figma-developer-mcp@0.13.2"
  - "--stdio"

requires:
  binaries: [npx, node]
  env: [FIGMA_API_KEY]

triggers:
  - figma
  - design tokens
  - component spec
  - design handoff

links:
  upstream: https://github.com/GLips/Figma-Context-MCP
