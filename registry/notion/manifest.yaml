kind: mcp
name: notion
version: 0.1.0
description: Notion MCP server — AI-driven interaction with Notion databases, pages, and blocks via the Notion API. Use whenever the agent needs to read or write Notion content, query databases, create pages, or update documentation stored in Notion.
domain: tooling
priority: P2

compatibility:
  opencode: native
  codex: native
  cursor: native
  kimi: native

source:
  type: npm
  package: "@notionhq/notion-mcp-server"

mcp_command:
  - npx
  - "-y"
  - "@notionhq/notion-mcp-server@2.2.1"

requires:
  binaries: [npx, node]
  env: [NOTION_API_KEY]

triggers:
  - notion
  - notion database
  - notion page
  - wiki
  - knowledge base
  - notion docs

links:
  upstream: https://github.com/makenotion/notion-mcp-server
  docs: https://developers.notion.com/docs/mcp
